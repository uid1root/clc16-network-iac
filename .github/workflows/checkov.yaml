name: Checkov
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  Checkov:
    name: 'Check TF Vuls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.10
        uses: actions/setup-python@v4	
        with:
          python-version: "3.10"
      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform